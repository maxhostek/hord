<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Batrachka</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Batrachka">
  <meta name="mobile-web-app-capable" content="yes">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="preload" as="image" href="logo.png" fetchpriority="high">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: clamp(14px, 4.5vw, 18px);
      -webkit-text-size-adjust: 100%;
      -moz-text-size-adjust: 100%;
      text-size-adjust: 100%;
      /* Поддержка масштабирования при zoom браузера */
      zoom: 1;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* ===== ГЛОБАЛЬНОЕ ПРАВИЛО ДЛЯ КРУГЛЫХ ЭЛЕМЕНТОВ ===== */
    /* Гарантирует идеальные круги при любом масштабе */
    *, *::before, *::after {
      -webkit-clip-path: unset;
      clip-path: unset;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      overscroll-behavior-y: contain;
      transition: background 0.3s, color 0.3s;
    }

    :root {
      --bg: #000;
      --surface: #1a1a1a;
      --text: #fff;
      --text-secondary: #999;
      --border: #333;
      --green: #25b47e;
      --danger: #e04e4e;
      --btn-bg: #333;
      --input-bg: transparent;
      --card-bg: #1e1e1e;
      --shadow: rgba(0, 0, 0, 0.8);
      --space-xs: clamp(4px, 1vw, 6px);
      --space-sm: clamp(6px, 1.5vw, 10px);
      --space-md: clamp(10px, 2.5vw, 16px);
      --space-lg: clamp(14px, 3.5vw, 24px);
      --space-xl: clamp(20px, 5vw, 32px);
    }

    body.admin-mode {
      --bg: #fff;
      --surface: #f5f5f5;
      --text: #111;
      --text-secondary: #666;
      --border: #e0e0e0;
      --btn-bg: #e0e0e0;
      --input-bg: #fff;
      --card-bg: #f9f9f9;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    @media (prefers-color-scheme: dark) {
      body.theme-system {
        --bg: #121212;
        --surface: #1e1e1e;
        --text: #e0e0e0;
        --border: #444;
        --btn-bg: #333;
        --input-bg: #1a1a1a;
        --card-bg: #252525;
      }
    }

    @media (min-width: 768px) {
      :root {
        --space-xs: 6px;
        --space-sm: 8px;
        --space-md: 12px;
        --space-lg: 16px;
        --space-xl: 24px;
      }
    }

    @media (min-width: 1024px) {
      :root {
        --space-xs: 8px;
        --space-sm: 10px;
        --space-md: 16px;
        --space-lg: 20px;
        --space-xl: 32px;
      }
    }

    body {
      background: var(--bg);
      color: var(--text);
    }

    body.admin-mode {
      background: var(--bg);
      align-items: flex-start;
    }

    body.user-mode {
      background: #000;
    }

    #app {
      width: 100%;
      height: 100%;
      max-width: clamp(320px, 100%, 560px);
      max-height: 100dvh;
      max-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 0);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    .svg-icon {
      display: inline-block;
      width: 1em;
      height: 1em;
      fill: currentColor;
      vertical-align: -0.125em;
      shape-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ===== ИДЕАЛЬНЫЕ КРУГИ ПРИ ЛЮБОМ МАСШТАБИРОВАНИИ ===== */
    .circle-perfect {
      width: var(--size, 24px);
      height: var(--size, 24px);
      aspect-ratio: 1 / 1;
      clip-path: circle(50%);
      -webkit-transform: translateZ(0) scale(1.0001);
      -moz-transform: translateZ(0) scale(1.0001);
      -ms-transform: translateZ(0) scale(1.0001);
      -o-transform: translateZ(0) scale(1.0001);
      transform: translateZ(0) scale(1.0001);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform;
      shape-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Кнопки с большим border-radius */
    .user-btn,
    .camera-btn,
    .framed-btn,
    .btn-save,
    .btn-cancel,
    .dialog-btn-yes,
    .dialog-btn-no,
    .edit-dialog-buttons button,
    .custom-dialog-buttons button {
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform;
    }

    /* Статус-бары и индикаторы */
    .ptr-indicator,
    .photo-toast,
    .sync-indicator,
    .user-status-container,
    .admin-stat,
    .admin-container h1 {
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .ptr-indicator,
    .photo-toast,
    .sync-indicator {
      position: fixed;
      top: calc(10px + env(safe-area-inset-top, 0));
      left: 50%;
      transform: translateX(-50%);
      z-index: 3000;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: var(--space-xs) var(--space-md);
      border-radius: 20px;
      font-size: clamp(0.7rem, 3.2vw, 0.85rem);
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .ptr-indicator.show,
    .photo-toast.show,
    .sync-indicator.show {
      opacity: 1;
    }

    .photo-toast {
      background: var(--green);
    }

    .sync-indicator {
      background: #ff9800;
    }

    .context-menu {
      position: fixed;
      background: var(--surface);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      z-index: 4000;
      min-width: clamp(160px, 55vw, 220px);
      max-width: 90vw;
      overflow: hidden;
      animation: contextIn 0.15s ease;
      border: 1px solid var(--border);
    }

    @keyframes contextIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .context-menu-item {
      padding: var(--space-sm) var(--space-md);
      font-size: clamp(0.85rem, 3.8vw, 1rem);
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      min-height: 44px;
    }

    .context-menu-item:last-child {
      border-bottom: none;
    }

    .context-menu-item.danger {
      color: var(--danger);
    }

    .edit-dialog-overlay,
    .custom-dialog-overlay,
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 5000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-md);
    }

    .edit-dialog,
    .custom-dialog {
      background: var(--surface);
      border-radius: 16px;
      padding: var(--space-lg) var(--space-md) var(--space-md);
      max-width: clamp(280px, 92vw, 380px);
      width: 100%;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      color: var(--text);
    }

    .edit-dialog h3 {
      margin-bottom: var(--space-md);
      font-size: clamp(1.05rem, 4.5vw, 1.2rem);
      text-align: center;
    }

    .edit-dialog label {
      display: block;
      font-size: clamp(0.75rem, 3.2vw, 0.9rem);
      margin-bottom: 4px;
      color: var(--text-secondary);
    }

    .edit-dialog input {
      width: 100%;
      padding: var(--space-sm) var(--space-md);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: clamp(0.85rem, 3.8vw, 1rem);
      margin-bottom: var(--space-md);
      outline: none;
      background: var(--input-bg);
      color: var(--text);
      min-height: 44px;
    }

    .edit-dialog-buttons,
    .custom-dialog-buttons {
      display: flex;
      gap: var(--space-sm);
    }

    .edit-dialog-buttons button,
    .custom-dialog-buttons button {
      flex: 1;
      padding: var(--space-sm);
      border-radius: 20px;
      border: none;
      font-size: clamp(0.8rem, 3.5vw, 0.95rem);
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
    }

    .btn-save {
      background: var(--green);
      color: #fff;
    }

    .btn-cancel,
    .dialog-btn-no {
      background: var(--btn-bg);
      color: var(--text);
    }

    .dialog-btn-yes {
      background: var(--danger);
      color: #fff;
    }

    .framed-btn {
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: var(--space-xs) var(--space-md);
      cursor: pointer;
      font-size: clamp(0.75rem, 3.2vw, 0.9rem);
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
      touch-action: manipulation;
      min-height: 40px;
      white-space: nowrap;
    }

    .login-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: var(--space-lg);
      gap: var(--space-xl);
    }

    .password-box {
      width: 100%;
      max-width: clamp(300px, 92vw, 420px);
      background: var(--surface);
      border-radius: clamp(2rem, 8vw, 3rem);
      display: flex;
      align-items: center;
      box-shadow: 0 20px 40px var(--shadow);
    }

    .password-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: clamp(1rem, 4.2vw, 1.2rem);
      color: var(--text);
      padding: clamp(0.7rem, 3vw, 0.9rem) clamp(1.2rem, 4vw, 1.8rem);
      caret-color: var(--text);
      min-height: 48px;
    }

    .password-box input::placeholder {
      color: var(--text-secondary);
    }

    .login-btn {
      --size: clamp(2.8rem, 10vw, 3.2rem);
      width: var(--size);
      height: var(--size);
      aspect-ratio: 1 / 1;
      clip-path: circle(50%);
      background: var(--btn-bg);
      border: none;
      cursor: pointer;
      margin: 0.3rem;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      -webkit-transform: translateZ(0) scale(1.0001);
      -moz-transform: translateZ(0) scale(1.0001);
      -ms-transform: translateZ(0) scale(1.0001);
      -o-transform: translateZ(0) scale(1.0001);
      transform: translateZ(0) scale(1.0001);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform;
      shape-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
    }

    .feedback {
      color: var(--text-secondary);
      font-size: clamp(0.85rem, 3.8vw, 1rem);
      text-align: center;
      min-height: 1.5rem;
    }

    .admin-container {
      background: var(--bg);
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: var(--space-md) var(--space-sm);
      color: var(--text);
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      margin-bottom: var(--space-sm);
      gap: 8px;
    }

    .admin-header-right {
      display: flex;
      gap: 8px;
    }

    .admin-header-btn {
      --size: clamp(32px, 8vw, 40px);
      width: var(--size);
      height: var(--size);
      aspect-ratio: 1 / 1;
      clip-path: circle(50%);
      background: var(--btn-bg);
      border: none;
      cursor: pointer;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0;
      -webkit-transform: translateZ(0) scale(1.0001);
      -moz-transform: translateZ(0) scale(1.0001);
      -ms-transform: translateZ(0) scale(1.0001);
      -o-transform: translateZ(0) scale(1.0001);
      transform: translateZ(0) scale(1.0001);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform;
      shape-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
      transition: background 0.2s, transform 0.15s;
    }

    .admin-header-btn:hover {
      background: var(--border);
      transform: translateZ(0) scale(1.05);
    }

    .admin-header-btn:active {
      transform: translateZ(0) scale(0.95);
    }

    @media (hover: none) {
      .admin-header-btn:hover {
        background: var(--btn-bg);
        transform: translateZ(0) scale(1);
      }
      
      .admin-header-btn:active {
        background: var(--border);
        transform: translateZ(0) scale(0.95);
      }
    }

    /* ===== Круглые кнопки в stats ===== */
    .stats-btn {
      --size: clamp(28px, 7vw, 34px);
      width: var(--size);
      height: var(--size);
      aspect-ratio: 1 / 1;
      clip-path: circle(50%);
      background: var(--btn-bg);
      border: none;
      cursor: pointer;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0;
      -webkit-transform: translateZ(0) scale(1.0001);
      -moz-transform: translateZ(0) scale(1.0001);
      -ms-transform: translateZ(0) scale(1.0001);
      -o-transform: translateZ(0) scale(1.0001);
      transform: translateZ(0) scale(1.0001);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform;
      shape-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
      transition: background 0.2s, transform 0.15s;
    }

    .stats-btn:hover {
      background: var(--border);
      transform: translateZ(0) scale(1.05);
    }

    .stats-btn:active {
      transform: translateZ(0) scale(0.95);
    }

    @media (hover: none) {
      .stats-btn:hover {
        background: var(--btn-bg);
        transform: translateZ(0) scale(1);
      }
      
      .stats-btn:active {
        background: var(--border);
        transform: translateZ(0) scale(0.95);
      }
    }

    .admin-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .admin-container h1 {
      font-weight: 800;
      font-size: clamp(2rem, 11vw, 3.5rem);
      text-transform: uppercase;
      margin: 0;
      letter-spacing: clamp(2px, 1.2vw, 6px);
      color: var(--text);
      line-height: 1;
    }

    .admin-stats {
      display: flex;
      gap: var(--space-sm);
      flex-shrink: 0;
      margin-bottom: var(--space-sm);
      align-items: center;
      flex-wrap: wrap;
    }

    .admin-stat {
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: var(--space-xs) var(--space-md);
      font-size: clamp(0.75rem, 3.2vw, 0.9rem);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text);
      cursor: default;
    }

    .dot {
      --size: clamp(8px, 2.5vw, 12px);
      width: var(--size);
      height: var(--size);
      aspect-ratio: 1 / 1;
      clip-path: circle(50%);
      display: inline-block;
      flex-shrink: 0;
      -webkit-transform: translateZ(0) scale(1.0001);
      -moz-transform: translateZ(0) scale(1.0001);
      -ms-transform: translateZ(0) scale(1.0001);
      -o-transform: translateZ(0) scale(1.0001);
      transform: translateZ(0) scale(1.0001);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform;
      shape-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
    }

    .dot.green {
      background: var(--green);
    }

    .admin-circle {
      --size: clamp(22px, 6vw, 28px);
      width: var(--size);
      height: var(--size);
      aspect-ratio: 1 / 1;
      clip-path: circle(50%);
      border: 2px solid #bdbdbd;
      background: transparent;
      flex-shrink: 0;
      transition: all 0.3s;
      pointer-events: none;
      -webkit-transform: translateZ(0) scale(1.0001);
      -moz-transform: translateZ(0) scale(1.0001);
      -ms-transform: translateZ(0) scale(1.0001);
      -o-transform: translateZ(0) scale(1.0001);
      transform: translateZ(0) scale(1.0001);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform;
      shape-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
    }

    .admin-circle.green {
      background: var(--green);
      border-color: var(--green);
    }

    .admin-list-wrapper {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .admin-row-wrapper {
      border-bottom: 1px solid var(--border);
    }

    .admin-row {
      display: flex;
      align-items: center;
      padding: var(--space-xs) var(--space-sm);
      min-height: 48px;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .admin-info {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .admin-name {
      font-size: clamp(0.85rem, 3.8vw, 1rem);
      flex: 1;
      word-break: break-word;
      pointer-events: none;
    }

    .admin-time {
      font-size: clamp(0.65rem, 2.8vw, 0.75rem);
      color: var(--text-secondary);
      white-space: nowrap;
      background: var(--surface);
      padding: 2px var(--space-sm);
      border-radius: 8px;
      flex-shrink: 0;
      pointer-events: none;
    }

    .kick-btn {
      --size: clamp(24px, 6vw, 28px);
      width: var(--size);
      height: var(--size);
      aspect-ratio: 1 / 1;
      clip-path: circle(50%);
      background: var(--danger);
      cursor: pointer;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      -webkit-transform: translateZ(0) scale(1.0001);
      -moz-transform: translateZ(0) scale(1.0001);
      -ms-transform: translateZ(0) scale(1.0001);
      -o-transform: translateZ(0) scale(1.0001);
      transform: translateZ(0) scale(1.0001);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform;
      shape-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
      border: none;
      padding: 0;
    }

    .photo-panel {
      background: var(--card-bg);
      padding: 0 var(--space-sm);
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.2s, padding 0.2s;
    }

    .photo-panel.open {
      max-height: 400px;
      padding: var(--space-md);
    }

    .photo-preview-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    .photo-preview {
      width: 100%;
      border-radius: 0;
      cursor: pointer;
      display: block;
      border: 1px solid var(--border);
      max-height: 300px;
      object-fit: contain;
      background: transparent;
    }

    .photo-empty {
      color: var(--text-secondary);
      text-align: center;
      padding: var(--space-md) 0;
      font-size: clamp(0.85rem, 3.5vw, 0.95rem);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60px;
    }

    .photo-timestamp {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: transparent;
      color: #fff;
      padding: 4px 8px;
      border-radius: 0;
      font-size: clamp(0.6rem, 2.5vw, 0.7rem);
      font-weight: 500;
      pointer-events: none;
      white-space: nowrap;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
    }

    .photo-delete-btn {
      --size: clamp(22px, 6vw, 28px);
      width: var(--size);
      height: var(--size);
      aspect-ratio: 1 / 1;
      clip-path: circle(50%);
      position: absolute;
      top: -8px;
      right: -8px;
      background: var(--danger);
      color: #fff;
      border: 2px solid #fff;
      font-size: clamp(12px, 3.5vw, 16px);
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      z-index: 2;
      -webkit-transform: translateZ(0) scale(1.0001);
      -moz-transform: translateZ(0) scale(1.0001);
      -ms-transform: translateZ(0) scale(1.0001);
      -o-transform: translateZ(0) scale(1.0001);
      transform: translateZ(0) scale(1.0001);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform;
      shape-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
    }

    .modal-overlay {
      z-index: 6000;
    }

    .modal-content {
      background: var(--surface);
      border-radius: 16px;
      padding: var(--space-md);
      max-width: min(92vw, 600px);
      max-height: 85dvh;
      text-align: center;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .modal-content img {
      max-width: 100%;
      max-height: 65dvh;
      width: auto;
      height: auto;
      border-radius: 20px;
      object-fit: contain;
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .modal-close {
      position: absolute;
      top: 6px;
      right: 10px;
      cursor: pointer;
      color: var(--text-secondary);
      background: none;
      border: none;
      line-height: 1;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-info {
      margin-top: var(--space-sm);
      color: var(--text-secondary);
      font-size: clamp(0.8rem, 3.2vw, 0.9rem);
    }

    .user-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      height: 100%;
      padding: var(--space-lg) var(--space-md);
      gap: var(--space-md);
      overflow-y: auto;
    }

    .user-name {
      color: #fff;
      font-size: clamp(1.6rem, 7vw, 2.2rem);
      text-align: center;
      font-weight: 700;
      word-break: break-word;
      margin-top: var(--space-md);
    }

    .user-logo {
      width: min(150px, 32vw);
      height: min(150px, 32vw);
      flex-shrink: 0;
    }

    .user-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .user-status-container {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      background: rgba(255, 255, 255, 0.05);
      padding: var(--space-sm) var(--space-lg);
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .user-status-label {
      color: #fff;
      font-size: clamp(0.85rem, 3.5vw, 1rem);
      font-weight: 500;
    }

    .user-status-circle {
      --size: clamp(14px, 4vw, 18px);
      width: var(--size);
      height: var(--size);
      aspect-ratio: 1 / 1;
      clip-path: circle(50%);
      border: 2px solid #555;
      background: transparent;
      flex-shrink: 0;
      transition: all 0.3s;
      -webkit-transform: translateZ(0) scale(1.0001);
      -moz-transform: translateZ(0) scale(1.0001);
      -ms-transform: translateZ(0) scale(1.0001);
      -o-transform: translateZ(0) scale(1.0001);
      transform: translateZ(0) scale(1.0001);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform;
      shape-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
    }

    .user-status-circle.green {
      background: var(--green);
      border-color: var(--green);
      box-shadow: 0 0 12px rgba(37, 180, 126, 0.5);
      -webkit-transform: translateZ(0) scale(1.0001);
      -moz-transform: translateZ(0) scale(1.0001);
      -ms-transform: translateZ(0) scale(1.0001);
      -o-transform: translateZ(0) scale(1.0001);
      transform: translateZ(0) scale(1.0001);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform;
      shape-rendering: geometricPrecision;
    }

    .user-buttons {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      width: 100%;
      max-width: min(380px, 95vw);
    }

    .user-btn {
      width: 100%;
      height: clamp(60px, 14vw, 80px);
      border-radius: 50px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: clamp(1.1rem, 5vw, 1.4rem);
      color: #fff;
      touch-action: manipulation;
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform;
    }

    .user-btn:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .btn-green {
      background: var(--green);
    }

    .camera-btn {
      flex: 1;
      height: clamp(44px, 10vw, 54px);
      border-radius: 30px;
      border: 2px dashed var(--green);
      background: rgba(37, 180, 126, 0.1);
      cursor: pointer;
      font-size: clamp(0.8rem, 3.5vw, 0.95rem);
      color: var(--green);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      touch-action: manipulation;
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform;
    }

    .camera-btn.hidden {
      display: none;
    }

    .preview-photo-wrapper {
      width: 100%;
      margin-top: var(--space-xs);
    }

    .preview-photo-wrapper.visible {
      display: block;
    }

    .photo-gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-xs);
      width: 100%;
      margin-top: var(--space-sm);
      container-type: inline-size;
      container-name: photo-gallery;
      /* Корректное отображение при zoom браузера */
      zoom: 1;
      -webkit-zoom: 1;
      -moz-zoom: 1;
    }

    .photo-thumb {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      width: 100%;
      aspect-ratio: 1 / 1;
      /* Fallback для старых браузеров */
      height: 0;
      padding-bottom: 100%;
    }

    .photo-thumb img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      /* Корректное отображение при zoom браузера */
      max-width: none;
      max-height: none;
    }

    .photo-thumb .photo-delete-btn {
      width: clamp(18px, 5vw, 24px);
      height: clamp(18px, 5vw, 24px);
      aspect-ratio: 1 / 1;
      clip-path: circle(50%);
      position: absolute;
      top: 4px;
      right: 4px;
      border: 2px solid #fff;
      background: var(--danger);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(8px, 2.5vw, 12px);
      line-height: 1;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      z-index: 2;
      -webkit-transform: translateZ(0) scale(1.0001);
      -moz-transform: translateZ(0) scale(1.0001);
      -ms-transform: translateZ(0) scale(1.0001);
      -o-transform: translateZ(0) scale(1.0001);
      transform: translateZ(0) scale(1.0001);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform;
      shape-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
    }

    .photo-thumb .photo-timestamp {
      position: absolute;
      left: 50%;
      bottom: 4px;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: clamp(0.5rem, 2.2vw, 0.6rem);
      white-space: nowrap;
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
      z-index: 1;
    }

    .preview-photo-card {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    .preview-photo {
      width: 100%;
      max-height: 40vh;
      object-fit: contain;
      background: transparent;
      border-radius: 0;
    }

    .user-photo-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 2;
    }

    .user-photo-timestamp {
      color: #fff;
      font-size: clamp(0.65rem, 2.8vw, 0.75rem);
      background: transparent;
      padding: 4px 10px;
      border-radius: 0;
      white-space: nowrap;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
    }

    .user-delete-btn {
      --size: clamp(22px, 6vw, 28px);
      width: var(--size);
      height: var(--size);
      aspect-ratio: 1 / 1;
      clip-path: circle(50%);
      background: var(--danger);
      color: #fff;
      border: 2px solid #fff;
      font-size: clamp(12px, 3.5vw, 16px);
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      -webkit-transform: translateZ(0) scale(1.0001);
      -moz-transform: translateZ(0) scale(1.0001);
      -ms-transform: translateZ(0) scale(1.0001);
      -o-transform: translateZ(0) scale(1.0001);
      transform: translateZ(0) scale(1.0001);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform;
      shape-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
    }

    .photo-empty {
      color: var(--text-secondary);
      text-align: center;
      padding: 10px 0;
      font-size: clamp(0.85rem, 3.5vw, 0.95rem);
    }

    /* ===== КОМПЛЕКСНАЯ ПОДДЕРЖКА ВСЕХ РАЗМЕРОВ ЭКРАНОВ ===== */

    /* ===== ГЛОБАЛЬНОЕ ПРАВИЛО ДЛЯ ВСЕХ КРУГОВ ===== */
    /* Гарантирует идеальные круги при любом масштабе */
    [class*="circle"],
    [class*="kick-btn"],
    [class*="delete-btn"],
    [class*="login-btn"],
    .dot {
      clip-path: circle(50%) !important;
      -webkit-clip-path: circle(50%) !important;
    }

    /* ===== Поддержка zoom браузера ===== */
    @media (-webkit-device-pixel-ratio: 1.5),
    (resolution: 144dpi) {
      .photo-thumb img {
        transform: scale(1.1);
        transform-origin: center center;
      }
    }

    @media (-webkit-device-pixel-ratio: 2),
    (resolution: 192dpi) {
      .photo-thumb img {
        transform: scale(1.2);
        transform-origin: center center;
      }
    }

    @media (-webkit-device-pixel-ratio: 3),
    (resolution: 288dpi) {
      .photo-thumb img {
        transform: scale(1.3);
        transform-origin: center center;
      }
    }

    /* ===== Очень маленькие экраны (до 320px) ===== */
    @media (max-width: 320px) {
      #app {
        max-width: 100%;
      }

      .admin-container {
        padding: 8px 6px;
      }

      .admin-container h1 {
        font-size: 1.6rem;
        letter-spacing: 1px;
      }

      .admin-row {
        padding: 6px 4px;
        min-height: 40px;
        gap: 4px;
      }

      .admin-name {
        font-size: 0.8rem;
      }

      .admin-time {
        font-size: 0.6rem;
        padding: 2px 4px;
      }

      .admin-circle,
      .kick-btn {
        --size: 20px;
      }

      .user-container {
        padding: 12px 8px;
        gap: 10px;
      }

      .user-name {
        font-size: 1.3rem;
        margin-top: 10px;
      }

      .user-logo {
        width: 100px;
        height: 100px;
      }

      .user-btn {
        height: 50px;
        font-size: 1rem;
      }

      .camera-btn {
        height: 40px;
        font-size: 0.75rem;
      }

      .photo-gallery-grid {
        gap: 4px;
      }

      .framed-btn {
        padding: 4px 8px;
        font-size: 0.7rem;
        min-height: 32px;
      }

      .password-box {
        border-radius: 2rem;
      }

      .password-box input {
        font-size: 0.9rem;
        padding: 0.6rem 1rem;
      }

      .login-btn {
        --size: 2.5rem;
      }

      .edit-dialog,
      .custom-dialog {
        padding: 16px 12px 12px;
        max-width: 95vw;
      }

      .edit-dialog h3 {
        font-size: 1rem;
      }
    }

    /* ===== Маленькие экраны (321-375px) ===== */
    @media (min-width: 321px) and (max-width: 375px) {
      .admin-container {
        padding: 10px 8px;
      }

      .admin-container h1 {
        font-size: 1.8rem;
        letter-spacing: 2px;
      }

      .admin-row {
        padding: 8px 6px;
        min-height: 44px;
      }

      .user-container {
        padding: 16px 10px;
        gap: 12px;
      }

      .user-name {
        font-size: 1.5rem;
      }

      .user-logo {
        width: 120px;
        height: 120px;
      }

      .user-btn {
        height: 55px;
        font-size: 1.1rem;
      }
    }

    /* ===== Средние экраны (376-414px) ===== */
    @media (min-width: 376px) and (max-width: 414px) {
      .admin-container {
        padding: 12px 10px;
      }

      .admin-container h1 {
        font-size: 2rem;
        letter-spacing: 2px;
      }

      .user-container {
        padding: 20px 12px;
        gap: 14px;
      }

      .user-logo {
        width: 140px;
        height: 140px;
      }
    }

    /* ===== Большие телефоны (415-768px) ===== */
    @media (min-width: 415px) and (max-width: 767px) {
      .admin-container {
        padding: 14px 12px;
      }

      .admin-container h1 {
        font-size: 2.2rem;
      }

      .admin-row {
        padding: 10px 8px;
        min-height: 48px;
      }

      .user-container {
        padding: 24px 16px;
        gap: 16px;
      }

      .user-logo {
        width: 160px;
        height: 160px;
      }
    }

    /* ===== Маленькие планшеты (768-1024px) ===== */
    @media (min-width: 768px) and (max-width: 1023px) {
      #app {
        max-width: 700px;
      }

      .admin-container {
        padding: 20px 24px;
      }

      .admin-row {
        padding: 12px 14px;
        min-height: 54px;
      }

      .admin-name {
        font-size: 1rem;
      }

      .photo-panel.open {
        max-height: 500px;
      }

      .user-container {
        padding: 32px 28px;
        gap: 20px;
      }

      .user-logo {
        width: 180px;
        height: 180px;
      }

      .user-btn {
        height: 65px;
        font-size: 1.2rem;
      }

      .modal-content {
        max-width: min(90vw, 500px);
      }
    }

    /* ===== Планшеты и маленькие десктопы (1024-1280px) ===== */
    @media (min-width: 1024px) and (max-width: 1279px) {
      #app {
        max-width: 800px;
      }

      .admin-container {
        padding: 24px 32px;
      }

      .admin-row {
        padding: 12px 16px;
        min-height: 56px;
      }

      .user-container {
        padding: 40px 36px;
        gap: 24px;
      }

      .user-logo {
        width: 200px;
        height: 200px;
      }

      .user-btn {
        height: 70px;
        font-size: 1.3rem;
      }

      .photo-gallery-grid {
        gap: 8px;
      }

      .modal-content {
        max-width: min(85vw, 600px);
      }
    }

    /* ===== Средние десктопы (1280-1440px) ===== */
    @media (min-width: 1280px) and (max-width: 1439px) {
      #app {
        max-width: 900px;
      }

      .admin-container {
        padding: 28px 40px;
      }

      .admin-container h1 {
        font-size: 3rem;
      }

      .user-container {
        padding: 48px 44px;
        gap: 28px;
      }

      .user-logo {
        width: 220px;
        height: 220px;
      }

      .user-btn {
        height: 75px;
        font-size: 1.35rem;
      }

      .photo-gallery-grid {
        gap: 10px;
      }

      .modal-content {
        max-width: min(80vw, 700px);
      }
    }

    /* ===== Большие десктопы (1440-1920px) ===== */
    @media (min-width: 1440px) and (max-width: 1919px) {
      #app {
        max-width: 1000px;
      }

      .admin-container {
        padding: 32px 48px;
      }

      .admin-container h1 {
        font-size: 3.2rem;
      }

      .user-container {
        padding: 56px 52px;
        gap: 32px;
      }

      .user-logo {
        width: 240px;
        height: 240px;
      }

      .user-btn {
        height: 80px;
        font-size: 1.4rem;
      }

      .photo-gallery-grid {
        gap: 12px;
      }

      .modal-content {
        max-width: min(75vw, 800px);
      }
    }

    /* ===== Очень большие десктопы (1920px+) ===== */
    @media (min-width: 1920px) {
      #app {
        max-width: 1100px;
      }

      .admin-container {
        padding: 36px 56px;
      }

      .admin-container h1 {
        font-size: 3.5rem;
      }

      .user-container {
        padding: 64px 60px;
        gap: 36px;
      }

      .user-logo {
        width: 260px;
        height: 260px;
      }

      .user-btn {
        height: 85px;
        font-size: 1.5rem;
      }

      .photo-gallery-grid {
        gap: 14px;
      }

      .modal-content {
        max-width: min(70vw, 900px);
      }
    }

    /* ===== Горизонтальная ориентация — маленькие телефоны ===== */
    @media (max-height: 400px) and (orientation: landscape) {
      #app {
        max-height: 100vh;
      }

      .user-container {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        padding: 8px 12px;
        gap: 8px;
      }

      .user-name {
        order: 1;
        font-size: 1.2rem;
        margin-top: 0;
        width: 100%;
        text-align: center;
      }

      .user-logo {
        order: 2;
        width: 60px;
        height: 60px;
      }

      .user-status-container {
        order: 3;
        padding: 6px 16px;
      }

      .user-buttons {
        order: 4;
        width: 100%;
        max-width: 100%;
      }

      .user-btn {
        height: 44px;
        font-size: 1rem;
      }

      .user-photo-section {
        order: 5;
        width: 100%;
        max-height: 30vh;
        overflow-y: auto;
      }

      .admin-container {
        padding: 6px 10px;
      }

      .admin-container h1 {
        font-size: 1.6rem;
      }

      .admin-list-wrapper {
        max-height: calc(100vh - 120px);
      }

      .admin-row {
        padding: 6px 8px;
        min-height: 36px;
      }
    }

    /* ===== Горизонтальная ориентация — планшеты ===== */
    @media (min-width: 768px) and (max-height: 600px) and (orientation: landscape) {
      .admin-container {
        flex-direction: row;
        gap: 20px;
      }

      .admin-header,
      .admin-stats {
        flex-direction: column;
        width: auto;
      }

      .admin-list-wrapper {
        flex: 1;
        max-height: calc(100vh - 80px);
      }

      .user-container {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        padding: 20px 30px;
      }

      .user-logo {
        width: 120px;
        height: 120px;
      }

      .user-buttons {
        flex-direction: row;
        width: auto;
      }

      .user-btn {
        width: auto;
        min-width: 200px;
      }
    }

    /* ===== Складные устройства (Foldables) ===== */
    @media (min-width: 600px) and (max-width: 900px) and (orientation: portrait) {
      #app {
        max-width: 100%;
      }

      .admin-container {
        padding: 16px 12px;
      }

      .user-container {
        padding: 24px 16px;
      }

      .user-logo {
        width: 150px;
        height: 150px;
      }
    }

    /* ===== Очень высокие экраны (супер-высокие телефоны) ===== */
    @media (min-height: 800px) and (max-width: 430px) {
      .user-container {
        justify-content: flex-start;
        padding-top: 40px;
      }

      .user-logo {
        margin-top: 20px;
      }

      .user-status-container {
        margin-top: 10px;
      }
    }

    /* ===== Очень низкие экраны ===== */
    @media (max-height: 400px) {
      .admin-container h1 {
        font-size: 1.5rem;
      }

      .admin-stats {
        display: none;
      }

      .admin-container {
        padding: 4px 8px;
      }
    }

    /* ===== Устройства с закруглёнными экранами (Notch/Dynamic Island) ===== */
    @supports (padding: max(0px)) {
      .admin-container {
        padding-left: max(10px, env(safe-area-inset-left));
        padding-right: max(10px, env(safe-area-inset-right));
      }

      .user-container {
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }
    }

    /* ===== Устройства с высоким DPI / Retina ===== */
    @media (-webkit-min-device-pixel-ratio: 2),
    (min-resolution: 192dpi) {

      .photo-preview,
      .modal-content img,
      .user-logo img,
      .photo-thumb img {
        image-rendering: -webkit-optimize-contrast;
        image-rendering: crisp-edges;
      }

    async function extractExifDate(file) {
      return new Promise((resolve) => {
        try { EXIF.getData(file, function () { const dt = EXIF.getTag(this, 'DateTimeOriginal') || EXIF.getTag(this, 'DateTimeDigitized') || EXIF.getTag(this, 'DateTime'); if (dt) { const parts = dt.split(' '); if (parts.length === 2) { const d = new Date(parts[0].replace(/:/g, '-') + 'T' + parts[1]); if (!isNaN(d.getTime())) { resolve(d.toISOString()); return; } } } resolve(null); }); } catch (e) { resolve(null); }
      });
    }

    async function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => { const img = new Image(); img.onload = () => { let w = img.width, h = img.height; if (w > 800) { h = Math.round((h * 800) / w); w = 800; } const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0, 0, w, h); canvas.toBlob(b => b ? resolve(b) : reject(new Error('fail')), 'image/jpeg', 0.85); }; img.src = e.target.result; };
        reader.onerror = reject; reader.readAsDataURL(file);
      });
    }

    async function uploadPhoto(userId, file) {
      let uploadFile = file;
      try { uploadFile = await compressImage(file); } catch (e) { }

      const fileName = `user_${userId}_${Date.now()}.jpg`;
      const { error } = await supabaseClient.storage.from('photos').upload(fileName, uploadFile, { upsert: true });
      if (error) throw new Error(`Storage error: ${error.message}`);
      const photoUrl = `${SUPABASE_URL}/storage/v1/object/public/photos/${fileName}`;
      return { photoUrl, fileName, photoTimestamp };

    async function uploadPhotosToGallery(userId, files, onTempSaved) {
      const gallery = getUserGallery(userId);
      const remaining = 6 - gallery.length;
      const selected = Array.from(files || []).slice(0, remaining);
      if ((files || []).length > remaining) {
        showToast(`Можно загрузить не более ${remaining} фото`);
      }
      if (selected.length === 0) return gallery;
      const tempEntries = selected.map((file, idx) => ({
        id: `temp_${Date.now()}_${idx}`,
        url: URL.createObjectURL(file),
        fileName: null,
        uploadedAt: new Date().toISOString(),
        timestamp: null,
        isLocal: true
      }));
      const merged = [...tempEntries, ...gallery].slice(0, 6);
      saveUserGallery(userId, merged);
      // Мгновенно показываем временные фото
      if (onTempSaved) onTempSaved(merged);
      for (let i = 0; i < tempEntries.length; i += 1) {
        const entry = tempEntries[i];
        const file = selected[i];
        const { photoUrl, fileName, photoTimestamp } = await uploadPhoto(userId, file);
        const target = merged.find(item => item.id === entry.id);
        if (target) {
          target.url = photoUrl;
          target.fileName = fileName;
          target.timestamp = photoTimestamp;
          target.uploadedAt = new Date().toISOString();
          target.isLocal = false;
        }
        if (entry.url.startsWith('blob:')) URL.revokeObjectURL(entry.url);
        // Обновляем после каждой загрузки
        saveUserGallery(userId, merged);
        if (onTempSaved) onTempSaved(merged);
      }
      const saved = saveUserGallery(userId, merged);
      await syncGalleryToStatus(userId, saved);
      return saved;
    }

    async function refreshUsersAndRender() { await loadUsersFromDB(); await renderAdminList(); sortAscending = true; }

    async function updateAdminRow(userId, newData, oldData) {
      const wrapper = document.querySelector(`.admin-row-wrapper[data-user-id="${userId}"]`);
      if (!wrapper) return;
      // Звук только при появлении зелёного статуса (не при изменении фото)
      const statusChanged = oldData && oldData.status !== newData.status;
      const photoChanged = oldData && oldData.photo_url !== newData.photo_url;
      if (statusChanged && newData.status === 'green' && !photoChanged) {
        getAudio('admin-update-sound.mp3')?.play().catch(() => { });
      }
      const circle = wrapper.querySelector('.admin-circle');
      const timeEl = wrapper.querySelector('.admin-time');
      if (circle) circle.className = 'admin-circle' + (newData.status === 'green' ? ' green' : '');
      if (timeEl) timeEl.textContent = newData.updated_at ? formatTime(newData.updated_at) : '';
      // Перерисовываем галерею если панель открыта
      const panel = wrapper.querySelector('.photo-panel');
      if (panel && panel.classList.contains('open')) {
        renderAdminPhotoGallery(userId, panel);
      }
      const greenCount = document.querySelectorAll('.admin-circle.green').length;
      const statEl = document.querySelector('.admin-stat .dot.green');
      if (statEl?.nextSibling) statEl.nextSibling.textContent = ' ' + greenCount;
    }

    async function renderAdminList() {
      const listWrapper = document.querySelector('.admin-list-wrapper');
      if (!listWrapper) return;
      const map = await loadAllStatuses();
      const green = Object.values(map).filter(s => s.status === 'green').length;
      // Синхронизируем галереи из БД в localStorage только если localStorage пуст
      for (const user of USERS) {
        const s = map[user.id];
        const localGallery = getUserGallery(user.id);
        if (!localGallery.length && s && s.photo_url) {
          try {
            const parsed = JSON.parse(s.photo_url);
            if (Array.isArray(parsed)) {
              saveUserGallery(user.id, parsed.map(g => ({ ...g, isLocal: false })));
            }
          } catch (e) {
            saveUserGallery(user.id, [{
              id: s.photo_url,
              url: s.photo_url,
              fileName: s.photo_url.split('/').pop(),
              uploadedAt: s.photo_updated_at || new Date().toISOString(),
              timestamp: s.photo_timestamp || null,
              isLocal: false
            }]);
          }
        }
      }
      listWrapper.innerHTML = USERS.map(user => {
        const s = map[user.id] || {};
        const time = s.updated_at ? formatTime(s.updated_at) : '';
        const cls = 'admin-circle circle-perfect' + (s.status === 'green' ? ' green' : '');
        const safeName = escapeJsString(user.name);
        return `<div class="admin-row-wrapper" data-user-id="${user.id}"><div class="admin-row"><div class="admin-info"><span class="admin-name">${safeName}</span><span class="admin-time">${time}</span></div><button class="kick-btn circle-perfect" style="--size: clamp(24px, 6vw, 28px);" onclick="event.stopPropagation();fullKickUser(${user.id})">${svgIcons.close}</button><div class="${cls}"></div></div><div class="photo-panel"><div class="photo-gallery-grid" id="photoGalleryGrid_${user.id}"></div></div></div>`;
      }).join('');
      const statEl = document.querySelector('.admin-stat .dot.green');
      if (statEl?.nextSibling) statEl.nextSibling.textContent = ' ' + green;
      bindAdminEvents();
    }

    function bindAdminEvents() {
      document.querySelectorAll('.admin-row').forEach(row => {
        const userId = parseInt(row.parentElement.dataset.userId);
        if (isNaN(userId)) return;
        const user = USERS.find(u => u.id === userId);
        const wrapper = row.parentElement;
        const panel = wrapper.querySelector('.photo-panel');

        row.onclick = function (e) {
          if (panel) {
            panel.classList.toggle('open');
            // Render admin gallery when panel opens
            if (panel.classList.contains('open') && !panel.dataset.rendered) {
              renderAdminPhotoGallery(userId, panel);
              panel.dataset.rendered = 'true';
            }
          }
        };
        row.addEventListener('touchstart', function (e) { longPressTimer = setTimeout(() => { vibrate(15); showContextMenu(user, e.touches[0].clientX, e.touches[0].clientY); }, 600); });
        row.addEventListener('touchend', () => { if (longPressTimer) clearTimeout(longPressTimer); });
        row.addEventListener('touchmove', () => { if (longPressTimer) clearTimeout(longPressTimer); });
      });
    }

    async function renderAdminPhotoGallery(userId, panelEl) {
      const galleryPhotos = getUserGallery(userId).slice(0, 6);

      const photoGalleryGrid = panelEl.querySelector('.photo-gallery-grid');
      if (!photoGalleryGrid) return;

      if (!galleryPhotos.length) {
        photoGalleryGrid.innerHTML = '<div class="photo-empty">Фото нет</div>';

      photoGalleryGrid.innerHTML = galleryPhotos.map((photo, index) => `

          e.stopPropagation();

    function applyGlobalTheme() {
      const theme = localStorage.getItem('adminTheme') || 'system';
      body.classList.remove('theme-system', 'theme-dark', 'theme-light');
      if (theme === 'dark') body.classList.add('theme-dark');
      else if (theme === 'light') body.classList.add('theme-light');
      else if (theme === 'system') body.classList.add('theme-system');
    }
    applyGlobalTheme();
    const THEMES = ['system', 'light', 'dark'];

    function initPullToRefresh() {
      let pullStartY = 0, pulling = false, pullDistance = 0;

      document.addEventListener('touchstart', e => {
        if (!body.classList.contains('admin-mode')) return;
        if (window.scrollY === 0 && document.querySelector('.admin-list-wrapper').scrollTop === 0) {
          pullStartY = e.touches[0].clientY;
          pulling = true;
          pullDistance = 0;
        }
      }, { passive: true });

      document.addEventListener('touchmove', e => {
        if (!pulling) return;
        pullDistance = e.touches[0].clientY - pullStartY;
        if (pullDistance > 0) {
          document.getElementById('ptrIndicator').classList.toggle('show', pullDistance > 60);
        }
      }, { passive: true });

      document.addEventListener('touchend', async () => {
        if (!pulling) return;
        pulling = false;
        if (pullDistance > 60) {
          document.getElementById('ptrIndicator').classList.remove('show');
          await fullRefreshAdmin();
        }
        pullDistance = 0;
      });
    }

    async function fullRefreshAdmin() { showSyncStatus(true); await refreshUsersAndRender(); showToast('Данные обновлены'); showSyncStatus(false); }

    async function quickSyncStatuses() {
      if (isSyncing || !body.classList.contains('admin-mode')) return;
      isSyncing = true;
      try {
        const map = await loadAllStatuses();
        document.querySelectorAll('.admin-row-wrapper').forEach(w => {
          const userId = parseInt(w.dataset.userId);
          if (isNaN(userId)) return;
          const s = map[userId];
          if (s) {
            w.querySelector('.admin-circle').className = 'admin-circle' + (s.status === 'green' ? ' green' : '');
            w.querySelector('.admin-time').textContent = s.updated_at ? formatTime(s.updated_at) : '';
            const panel = w.querySelector('.photo-panel');
            if (panel) {
              renderAdminPhotoGallery(userId, panel);
            }
          }
        });
        const cnt = document.querySelectorAll('.admin-circle.green').length;
        const stat = document.querySelector('.admin-stat .dot.green');
        if (stat?.nextSibling) stat.nextSibling.textContent = ' ' + cnt;
        showSyncStatus(false);
      } catch (e) { showSyncStatus(true); }
      isSyncing = false;
    }

    function cleanup() {
      if (adminChannel) { supabaseClient.removeChannel(adminChannel); adminChannel = null; }
      if (userChannel) { supabaseClient.removeChannel(userChannel); userChannel = null; }
      if (syncInterval) { clearInterval(syncInterval); syncInterval = null; }

    // ==================== СТРАНИЦЫ ====================
    function showLoginPage() {
      cleanup();
      body.className = '';
      applyGlobalTheme();
      appDiv.innerHTML = `<div class="login-wrapper"><div class="password-box"><input type="password" id="passwordInput" placeholder="Введите пароль" autocomplete="off"><button class="login-btn circle-perfect" id="loginButton">${svgIcons.arrowRight}</button></div><div class="feedback" id="feedbackMessage"></div></div>`;
      const inp = document.getElementById('passwordInput'), msg = document.getElementById('feedbackMessage');
      async function handle() {
        vibrate(10);
        const pwd = inp.value.trim();
        if (!pwd) { msg.textContent = 'Введите пароль'; msg.style.color = '#aaa'; return; }
        if (pwd === ADMIN_PASSWORD) { localStorage.setItem('role', 'admin'); msg.textContent = '✓ Администратор'; msg.style.color = '#4caf50'; setTimeout(showAdminPage, 200); return; }
        const user = await findUserByPassword(pwd);
        if (!user) { msg.textContent = '✗ Неверный пароль'; msg.style.color = '#e04e4e'; inp.value = ''; return; }
        const devId = getOrCreateDeviceId();
        try {
          const res = await tryLoginWithDevice(user.id, devId);
          if (res.success) { localStorage.setItem('role', 'user'); localStorage.setItem('userId', user.id); localStorage.setItem('name', user.name); msg.textContent = '✓ ' + user.name; msg.style.color = '#4caf50'; setTimeout(showUserPage, 200); }
          else { msg.textContent = res.message; msg.style.color = '#e04e4e'; inp.value = ''; }
        } catch (e) { msg.textContent = 'Ошибка соединения'; msg.style.color = '#e04e4e'; }
      }
      document.getElementById('loginButton').onclick = handle;
      inp.onkeypress = e => { if (e.key === 'Enter') handle(); };
      setTimeout(() => inp.focus(), 300);
    }

    async function showAdminPage() {
      cleanup();
      sortAscending = true;
      await loadUsersFromDB();
      body.className = 'admin-mode';
      applyGlobalTheme();
      getAudio('admin-enter-sound.mp3')?.play().catch(() => { });
      const map = await loadAllStatuses();
      const green = Object.values(map).filter(s => s.status === 'green').length;
      appDiv.innerHTML = `<div class="admin-container"><div class="admin-header"><div class="admin-header-left"><h1>KEK</h1></div><div class="admin-header-right"><button class="admin-header-btn" id="refreshBtn">${svgIcons.refresh}</button><button class="admin-header-btn" id="themeBtn">${svgIcons.theme}</button><button class="admin-header-btn" id="logoutBtn">${svgIcons.logout}</button></div></div><div class="admin-stats"><div class="admin-stat"><span class="dot green"></span> ${green}</div><button class="stats-btn" id="addUserBtn">${svgIcons.plus}</button><button class="stats-btn" id="sortBtn">${svgIcons.arrowDown}</button></div><div class="admin-list-wrapper">${USERS.map(user => { const s = map[user.id] || {}; const safeName = escapeJsString(user.name); return `<div class="admin-row-wrapper" data-user-id="${user.id}"><div class="admin-row"><div class="admin-info"><span class="admin-name">${safeName}</span><span class="admin-time">${s.updated_at ? formatTime(s.updated_at) : ''}</span></div><button class="kick-btn" onclick="event.stopPropagation();fullKickUser(${user.id})">${svgIcons.close}</button><div class="admin-circle${s.status === 'green' ? ' green' : ''}"></div></div><div class="photo-panel"><div class="photo-gallery-grid" id="photoGalleryGrid_${user.id}"></div></div></div>`; }).join('')}</div></div>`;
      document.getElementById('refreshBtn').onclick = fullRefreshAdmin;
      document.getElementById('themeBtn').onclick = () => { const cur = localStorage.getItem('adminTheme') || 'system'; localStorage.setItem('adminTheme', THEMES[(THEMES.indexOf(cur) + 1) % 3]); applyGlobalTheme(); };
      document.getElementById('logoutBtn').onclick = () => { localStorage.removeItem('role'); showLoginPage(); };
      document.getElementById('addUserBtn').onclick = showAddUserDialog;
      document.getElementById('sortBtn').onclick = function () {
        sortAscending = !sortAscending;
        if (sortAscending) {
          USERS.sort((a, b) => a.name.localeCompare(b.name, 'ru'));
          showToast('Список отсортирован А-Я');
        } else {
          USERS.sort((a, b) => b.name.localeCompare(a.name, 'ru'));
          showToast('Список отсортирован Я-А');
        }
        document.getElementById('sortBtn').innerHTML = sortAscending ? svgIcons.arrowDown : svgIcons.arrowUp;
        renderAdminList().catch(function (e) { console.error(e); });
      };
      bindAdminEvents();
      initPullToRefresh();
      adminChannel = supabaseClient.channel('admin-updates').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'user_statuses' }, payload => {
        if (payload.new && payload.new.user_id) {
          updateAdminRow(payload.new.user_id, payload.new, payload.old);
        }
      }).subscribe();
      syncInterval = setInterval(async () => { await autoResetExpiredStatuses(); await autoDeleteExpiredPhotos(); quickSyncStatuses(); }, 60000);
      quickSyncStatuses();
    }

    async function showUserPage() {
      cleanup();
      const userId = parseInt(localStorage.getItem('userId'));
      const name = localStorage.getItem('name');
      if (isNaN(userId) || !name) { showLoginPage(); return; }
      body.className = 'user-mode'; applyGlobalTheme();
      const data = await loadUserStatus(userId);
      const isGreen = data.status === 'green';
      let galleryPhotos = getUserGallery(userId);

      appDiv.innerHTML = `<div class="user-container" id="userContainer">
        <div style="position: absolute; top: 10px; right: 10px;"><button class="framed-btn" id="logoutBtn">${svgIcons.logout}</button></div>
        <div class="user-name">${escapeHtml(name)}</div>
        <div class="user-logo"><img src="logo.png" alt="Логотип" decoding="sync"></div>

        <div class="user-buttons"><button class="user-btn btn-green" id="greenBtn"${isGreen ? ' disabled style="opacity:0.6"' : ''}>Готов вкалывать!</button></div>
        <input type="file" id="cameraInput" accept="image/*" multiple style="display:none">
        <div class="user-photo-section" style="width:100%; max-width:380px;">
          ${isGreen ? `
            <div style="display:flex; gap:8px; margin-bottom:8px;">
              <button class="camera-btn" id="cameraBtn" type="button">Сделать снимок</button>
              <button class="camera-btn" id="fileBtn" type="button">Загрузить фото</button>
            </div>
            <div class="photo-gallery-grid" id="photoGalleryGrid"></div>
          ` : ``}
        </div>
      </div>`;

      const circle = document.getElementById('userStatusCircle'), greenBtn = document.getElementById('greenBtn');
      let cameraBtn, fileBtn, cameraInput, photoGalleryGrid;

      if (isGreen) {
        cameraBtn = document.getElementById('cameraBtn');
        fileBtn = document.getElementById('fileBtn');
        cameraInput = document.getElementById('cameraInput');
        photoGalleryGrid = document.getElementById('photoGalleryGrid');
      }

      function renderPhotoGallery() {
        if (!photoGalleryGrid) return;
        if (!galleryPhotos.length) {
          return;
        }
        photoGalleryGrid.innerHTML = galleryPhotos.map((photo, index) => `
          <div class="photo-thumb">
            <img src="${photo.url}" alt="Фото" loading="lazy" data-index="${index}">
            <button class="photo-delete-btn circle-perfect" style="--size: clamp(18px, 5vw, 24px);" data-index="${index}" type="button">${svgIcons.close}</button>
          </div>
        `).join('');
        photoGalleryGrid.querySelectorAll('.photo-thumb img').forEach(img => {
          img.onclick = () => showPhotoModal(img.getAttribute('src'), name, '', '');
        });
        photoGalleryGrid.querySelectorAll('.photo-delete-btn').forEach(btn => {
          btn.onclick = async (e) => {
            e.stopPropagation();
            if (!confirm('Удалить фото?')) return;
            const idx = Number(btn.getAttribute('data-index'));
            const updated = await deleteGalleryPhoto(userId, idx);
            galleryPhotos = updated || getUserGallery(userId);
            renderPhotoGallery();
            getAudio('photo-delete-sound.mp3')?.play().catch(() => { });
            showToast('Фото удалено');
          };
        });
      }

      renderPhotoGallery();

      userChannel = supabaseClient.channel('user-' + userId)
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'user_statuses', filter: 'user_id=eq.' + userId }, payload => {
          if (payload.new) {
            if (payload.new.device_id !== undefined && payload.new.device_id !== getOrCreateDeviceId()) { alert('Сессия завершена.'); localStorage.clear(); showLoginPage(); return; }
            if (payload.new.status !== data.status) { showUserPage(); return; }
            if (payload.new.photo_url !== data.photo_url) {
              galleryPhotos = getUserGallery(userId);
              renderPhotoGallery();
            }
          }
        }).subscribe();

      if (isGreen) {
        cameraBtn.onclick = () => {
          vibrate(10);
          cameraInput.setAttribute('capture', 'environment');
          cameraInput.multiple = true;
          cameraInput.click();
        };
        fileBtn.onclick = () => {
          vibrate(10);
          cameraInput.removeAttribute('capture');
          cameraInput.multiple = true;
          cameraInput.click();
        };
        cameraInput.onchange = async e => {
          const files = Array.from(e.target.files || []);
          if (!files.length) return;
          e.target.value = '';
          try {
            const updated = await uploadPhotosToGallery(userId, files, (merged) => {
              galleryPhotos = merged;
              renderPhotoGallery();
              showToast('Фото загружено');
            });
            galleryPhotos = updated || getUserGallery(userId);
            renderPhotoGallery();
          } catch (err) {
            alert('Ошибка: ' + err.message);
          }
        };
      }

      document.getElementById('logoutBtn').onclick = () => { localStorage.removeItem('role'); localStorage.removeItem('userId'); localStorage.removeItem('name'); showLoginPage(); };

      greenBtn.onclick = async () => {
        if (isGreen) return;
        vibrate(30); greenBtn.disabled = true; greenBtn.style.opacity = '0.6';
        await saveUserStatus(userId, 'green'); getAudio('green-sound.mp3')?.play().catch(() => { });
        showUserPage();
      };

      const refreshInterval = setInterval(async () => {
        const fresh = await loadUserStatus(userId);
        if (fresh.status !== (circle.classList.contains('green') ? 'green' : null)) {
          if (fresh.status === 'green') {
            circle.classList.add('green');
            greenBtn.disabled = true; greenBtn.style.opacity = '0.6';
          } else {
            circle.classList.remove('green');
            greenBtn.disabled = false; greenBtn.style.opacity = '1';
          }
        }
      }, 60000);

      window.addEventListener('beforeunload', () => clearInterval(refreshInterval));
      const originalCleanup = cleanup;
      cleanup = function () { clearInterval(refreshInterval); originalCleanup(); };

      // Pull-to-refresh для пользователя
      const userContainer = document.getElementById('userContainer');
      if (userContainer) {
        let pullStartY = 0, pulling = false, pullDistance = 0;
        userContainer.addEventListener('touchstart', e => {
          if (userContainer.scrollTop === 0) {
            pullStartY = e.touches[0].clientY;
            pulling = true;
            pullDistance = 0;
          }
        }, { passive: true });
        userContainer.addEventListener('touchmove', e => {
          if (!pulling) return;
          pullDistance = e.touches[0].clientY - pullStartY;
          if (pullDistance > 0) {
            document.getElementById('ptrIndicator').classList.toggle('show', pullDistance > 60);
          }
        }, { passive: true });
        userContainer.addEventListener('touchend', async () => {
          if (!pulling) return;
          pulling = false;
          if (pullDistance > 60) {
            document.getElementById('ptrIndicator').classList.remove('show');
            showSyncStatus(true);
            const fresh = await loadUserStatus(userId);
            galleryPhotos = getUserGallery(userId);
            if (fresh.status === 'green' && !isGreen) {
              showSyncStatus(false);
              showUserPage();
            } else {
              if (galleryPhotos.length) renderPhotoGallery();
              showSyncStatus(false);
              showToast('Данные обновлены');
            }
          }
          pullDistance = 0;
        });
      }
    }

    async function initApp() {
      await loadUsersFromDB();
      const role = localStorage.getItem('role');
      if (role === 'admin') showAdminPage();
      else if (role === 'user' && localStorage.getItem('userId')) showUserPage();
      else showLoginPage();
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { scope: './' })
        .then(reg => console.log('SW registered:', reg.scope))
        .catch(err => console.error('SW registration failed:', err));
    }

    // ===== ГЛОБАЛЬНАЯ ЗАЩИТА КРУГОВ ПРИ ЛЮБОМ МАСШТАБЕ =====
    (function() {
      const circleSelectors = [
        '.circle-perfect',
        '.login-btn',
        '.dot',
        '.admin-circle',
        '.kick-btn',
        '.photo-delete-btn',
        '.user-status-circle',
        '.user-delete-btn',
        '.photo-thumb .photo-delete-btn'
      ];
      const circleElements = document.querySelectorAll(circleSelectors.join(','));
      
      function ensureCircleShape() {
        circleElements.forEach(el => {
          if (el) {
            // Принудительно применяем clip-path для идеального круга
            el.style.clipPath = 'circle(50%)';
            el.style.webkitClipPath = 'circle(50%)';
            // Аппаратное ускорение
            el.style.transform = 'translateZ(0) scale(1.0001)';
            el.style.backfaceVisibility = 'hidden';
          }
        });
      }
      
      // Запускаем при загрузке
      ensureCircleShape();
      
      // Запускаем после рендеринга каждой страницы
      const observer = new MutationObserver(() => {
        setTimeout(ensureCircleShape, 50);
      });
      observer.observe(document.body, { childList: true, subtree: true });
      
      // Мониторинг изменения масштаба страницы
      let lastZoomLevel = 1;
      setInterval(() => {
        const zoomLevel = window.devicePixelRatio || 1;
        if (Math.abs(zoomLevel - lastZoomLevel) > 0.05) {
          lastZoomLevel = zoomLevel;
          ensureCircleShape();
        }
      }, 300);
    })();

    // ===== АВТОМАТИЧЕСКАЯ ПОДСТРОЙКА ИЗОБРАЖЕНИЙ ПОД РАЗМЕР ДИСПЛЕЯ =====
    (function() {
      let resizeTimer;
      const images = document.querySelectorAll('.photo-thumb img, .modal-content img, .user-logo img, .photo-preview');
      
      function optimizeImages() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const dpr = window.devicePixelRatio || 1;
        
        // Определяем оптимальный масштаб для изображений
        let scale = 1;
        if (vw < 400) scale = 0.9;
        else if (vw < 768) scale = 1;
        else if (vw < 1024) scale = 1.1;
        else scale = 1.2;
        
        // Применяем масштаб к изображениям
        images.forEach(img => {
          if (img.closest('.photo-thumb')) {
            img.style.transform = `scale(${scale})`;
            img.style.transformOrigin = 'center center';
          }
        });
      }
      
      // Оптимизация при загрузке
      optimizeImages();
      
      // Оптимизация при изменении размера окна
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(optimizeImages, 150);
      });
      
      // Оптимизация при изменении zoom браузера
      let lastZoom = window.devicePixelRatio;
      setInterval(() => {
        const currentZoom = window.devicePixelRatio;
        if (currentZoom !== lastZoom) {
          lastZoom = currentZoom;
          optimizeImages();
        }
      }, 500);
    })();

    window.addEventListener('online', () => { showSyncStatus(false); if (body.classList.contains('admin-mode')) quickSyncStatuses(); });
    window.addEventListener('offline', () => showSyncStatus(true));
    document.addEventListener('click', e => { if (contextMenu && !contextMenu.contains(e.target)) hideContextMenu(); });
    initApp();
  </script>
</body>
